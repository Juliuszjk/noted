# Builds the server image (amd64 + arm64) and pushes it to ghcr.io/<owner>/noted-server:
# on a version tag (v1.2.3 -> tags 1.2.3 and latest) or by hand from the Actions tab.
name: Server image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter api... --filter web...
      # The bundles the public server serves (not in git). No build default server address.
      - run: cp packages/config/server.example.ts packages/config/server.ts
      - run: pnpm --filter api run build:viewer
      - run: pnpm --filter web run build:live
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/noted-server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.description=Noted sync server (zero-knowledge: stores only encrypted data)
          cache-from: type=gha
          cache-to: type=gha,mode=max
