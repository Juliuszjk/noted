<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <style>
    /* Colours: CSS variables set from @noted/theme by main.ts. */
    html, body { background: var(--bg-base); color: var(--text-main); margin: 0; }
    body { font-family: sans-serif; padding: 20px; }
    .ProseMirror { outline: none; min-height: 90vh; font-size: var(--editor-font-size, 16px); }
    #title {
      display: block; width: 100%; box-sizing: border-box; resize: none; overflow: hidden;
      margin: 0 0 12px; padding: 0; border: none; outline: none; background: transparent;
      color: var(--text-main); font-size: 26px; font-weight: 700; line-height: 1.25;
    }
    #title::placeholder { color: var(--text-muted); }

    #wordcount { font-size: 13px; color: var(--text-muted); margin: 0 0 8px; min-height: 18px; }

    /* Formatting toolbar above the keyboard (toolbar.ts). */
    .tb { position: fixed; left: 0; right: 0; bottom: 0; z-index: 100; display: none; flex-direction: column; }
    .tb.visible { display: flex; }
    .tb-main { display: flex; align-items: center; gap: 2px; height: 52px; padding: 0 6px; overflow-x: auto;
      scrollbar-width: none; background: var(--bg-surface-low); }
    .tb-main::-webkit-scrollbar, .tb-float::-webkit-scrollbar { display: none; }
    .tb-btn { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 2px; min-width: 44px;
      height: 44px; padding: 0 8px; border: none; border-radius: 12px; background: transparent; color: var(--text-main);
      font: inherit; font-size: 15px; }
    .tb-btn.active { background: var(--secondary-container); color: var(--on-secondary-container); }
    .tb-btn.tb-plus { color: var(--primary); }
    .tb-btn.tb-caret { min-width: 26px; padding: 0 2px; color: var(--text-muted); }
    .tb-btn.tb-text { white-space: nowrap; padding: 0 10px; }
    .tb-btn.tb-size { min-width: 52px; padding: 0 4px; }
    .tb-btn.tb-small { min-width: 40px; height: 40px; }
    .tb-sep { flex: 0 0 1px; height: 26px; margin: 0 4px; background: var(--border); }
    .tb-float { display: none; align-items: center; gap: 2px; margin: 0 8px 8px; padding: 4px; overflow-x: auto;
      scrollbar-width: none; border-radius: 16px; background: var(--bg-surface-high);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35); }
    .tb-float.open { display: flex; }
    .tb-colors { justify-content: space-between; }
    .tb-swatch { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 20px; border: 2px solid transparent; }
    /* Bigger corner handle for fingers (the image is resized by dragging it). */
    .tb-toast { position: fixed; left: 16px; right: 16px; z-index: 200; display: none; padding: 12px 16px; border-radius: 14px;
      background: var(--bg-surface-highest); color: var(--text-main); font-size: 14px; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35); }
    .tb-toast.open { display: block; }
    .tb-sv { position: relative; height: 170px; margin: 4px 0 16px; border-radius: 12px; touch-action: none;
      background-image: linear-gradient(to top, #000, transparent), linear-gradient(to right, #fff, transparent); }
    .tb-sv-knob, .tb-hue-knob { position: absolute; border: 3px solid #fff; border-radius: 50%; pointer-events: none;
      box-shadow: 0 0 3px rgba(0, 0, 0, 0.7); }
    .tb-sv-knob { width: 18px; height: 18px; margin: -12px 0 0 -12px; }
    .tb-hue { position: relative; height: 28px; margin: 0 4px 16px; border-radius: 14px; touch-action: none;
      background: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
    .tb-hue-knob { top: 50%; width: 22px; height: 22px; margin: -14px 0 0 -14px; }
    .tb-color-preview { flex: 0 0 44px; height: 44px; border-radius: 22px; border: 1px solid var(--border); }
    .tb-swatch-none { min-width: 40px; height: 40px; border-radius: 20px; background: var(--bg-surface-highest); }

    .tb-sheet { display: none; flex-direction: column; max-height: 60vh; border-radius: 24px 24px 0 0;
      background: var(--bg-surface-high); box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.4); }
    .tb-sheet.open { display: flex; }
    .tb-handle { width: 48px; height: 5px; border-radius: 3px; margin: 10px auto 4px; background: var(--border-focus); opacity: 0.6; }
    .tb-sheet-head { display: flex; align-items: center; gap: 4px; padding: 0 8px 0 16px; min-height: 48px; }
    .tb-sheet-title { flex: 1; font-size: 18px; font-weight: 700; color: var(--text-main); }
    .tb-sheet-body { overflow-y: auto; padding: 0 8px 12px; }
    /* Scrolling a list never moves the note behind it (the page scrolled along, and the bar
       and the list were moved after it frame by frame). */
    .tb-sheet-body, .tb-float, .tb-slash { overscroll-behavior: contain; }
    .tb-row { display: flex; align-items: center; gap: 16px; width: 100%; min-height: 52px; padding: 0 12px;
      border: none; border-radius: 12px; background: transparent; color: var(--text-main); font: inherit; font-size: 16px; text-align: left; }
    .tb-row svg { color: var(--text-muted); flex: 0 0 auto; }
    .tb-row.active { background: var(--secondary-container); color: var(--on-secondary-container); }
    .tb-row-label { flex: 1; }
    .tb-row-two { display: flex; flex-direction: column; min-width: 0; }
    .tb-row-two .tb-row-main, .tb-row-two .tb-row-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tb-row-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
    .tb-list { display: flex; flex-direction: column; }
    .tb-input { width: 100%; box-sizing: border-box; padding: 12px 14px; margin: 4px 0 10px; font: inherit; font-size: 16px;
      color: var(--text-main); background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; outline: none; }
    .tb-input.invalid { border-color: var(--error); }
    .tb-math { min-height: 84px; font-family: monospace; resize: vertical; }
    .tb-preview { min-height: 32px; padding: 4px 2px 10px; overflow-x: auto; color: var(--text-main); }
    .tb-fields { display: flex; gap: 10px; align-items: center; }
    .tb-fields .tb-input { margin: 0; }
    .tb-field { flex: 1; display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 1px solid var(--border);
      border-radius: 12px; color: var(--text-main); }
    .tb-field .tb-input { border: none; padding: 12px 0; background: transparent; }
    .tb-primary, .tb-secondary { flex: 0 0 auto; padding: 12px 20px; border: none; border-radius: 22px; font: inherit; font-size: 15px; }
    .tb-primary { background: var(--primary); color: var(--primary-fg); }
    .tb-primary:disabled { opacity: 0.5; }
    .tb-secondary { background: var(--bg-surface-highest); color: var(--text-main); }
    .tb-secondary.danger { color: var(--error); }
    .tb-sheet-body > .tb-primary { width: 100%; margin-top: 12px; }
    .tb-table-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin: 4px 0 12px; }
    .tb-cell { aspect-ratio: 1; border-radius: 6px; background: var(--bg-surface-highest); }
    .tb-cell.on { background: var(--primary); }
    .tb-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .tb-chip { min-width: 52px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: transparent;
      color: var(--text-main); font: inherit; }
    .tb-chip.active { background: var(--secondary-container); color: var(--on-secondary-container); border-color: transparent; }
    .tb-size-input { width: 120px; flex: 1; }
    .tb-hint { color: var(--text-muted); font-size: 14px; padding: 8px 12px; }
    #chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px 4px 8px; border: none; border-radius: 10px;
      font: inherit; font-size: 13px; background: var(--bg-surface-high); color: var(--text-main); }
    .chip svg { flex: 0 0 auto; opacity: 0.85; }
    .chip-tag { color: var(--primary); }
    .chip-empty { background: transparent; border: 1px dashed var(--border); color: var(--text-muted); }
    .tb-linkbar { align-items: center; }
    .tb-link-url { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left;
      border: none; background: transparent; color: var(--primary); text-decoration: underline; font: inherit; font-size: 14px; padding: 0 8px; }
    .tb-label { font-size: 13px; color: var(--text-main); margin: 6px 2px 0; }
    .tb-end { justify-content: flex-end; margin-top: 4px; }
    .tb-align { align-self: flex-end; }
    .tb-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; padding: 4px 0 8px; }
    .tb-tile { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 12px; background: transparent; }
    .tb-tile.active { background: var(--secondary-container); border-color: transparent; }
    .tb-tile-line { display: flex; align-items: center; gap: 8px; height: 18px; }
    .tb-tile-marker { width: 26px; text-align: right; font-size: 13px; color: var(--text-main); white-space: pre; }
    .tb-tile-bar { flex: 1; height: 7px; border-radius: 4px; background: var(--border-focus); }
    .tb-error { color: var(--error); font-size: 14px; }
    .tb.inserting .tb-float { display: none; }
    .tb.no-bar .tb-main { display: none; }
    .tb.no-bar .tb-sheet { padding-bottom: env(safe-area-inset-bottom, 0px); }
    /* "/" menu: rows above the bar, the keyboard stays. */
    .tb-float.tb-slash { flex-direction: column; align-items: stretch; overflow-x: hidden; overflow-y: auto; padding: 6px; }
    .tb-slash .tb-row { min-height: 46px; }
    .tb-divider { height: 1px; margin: 4px 8px; background: var(--border); flex: 0 0 auto; }
    /* Long press on a note link. */
    .tb-float.tb-notelink { position: fixed; left: 0; right: 0; z-index: 101; }
    .tb-notelink-title { text-decoration: none; color: var(--text-main); font-weight: 600; }
    [data-note-link] { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    /* The phone's font sits the task checkbox a little low next to the first line. */
    body .ProseMirror ul[data-type="taskList"] li > label input { transform: translateY(-2px); }
    /* Find and replace (find.ts), pinned to the top of the visible area. */
    .find-bar { display: none; position: fixed; left: 0; right: 0; top: 0; z-index: 120; flex-direction: column; gap: 6px;
      padding: 8px 8px 8px 12px; background: var(--bg-surface-high); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35); }
    .find-bar.open { display: flex; }
    body.finding { padding-top: 120px; }
    .find-row { display: flex; align-items: center; gap: 2px; }
    .find-row .find-input { flex: 1; min-width: 0; margin: 0; padding: 10px 12px; }
    .find-row .tb-btn { min-width: 38px; padding: 0 4px; }
    .find-count { min-width: 40px; text-align: center; font-size: 13px; color: var(--text-muted); }
    .find-replace .tb-secondary { padding: 10px 14px; margin-left: 4px; }
    /* Older versions of the note (history-view.ts). */
    body.history-open { overflow: hidden; }
    .history-view { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column; background: var(--bg-base); }
    .history-head { padding: 12px 16px 0; border-bottom: 1px solid var(--border); }
    .history-title { font-size: 20px; font-weight: 700; text-align: center; }
    .history-when { font-size: 13px; color: var(--text-muted); text-align: center; margin: 4px 0 10px; }
    .history-actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
    .history-action { display: flex; align-items: center; gap: 6px; padding: 9px 14px; border: 1px solid var(--border); border-radius: 20px;
      background: transparent; color: var(--text-main); font: inherit; font-size: 14px; font-weight: 600; }
    .history-action.danger { border: none; background: var(--error); color: var(--bg-base); }
    .history-tabs { display: flex; margin-top: 12px; }
    .history-tab { flex: 1; padding: 12px 0; border: none; border-bottom: 2px solid transparent; background: transparent;
      color: var(--text-muted); font: inherit; font-size: 15px; font-weight: 600; }
    .history-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .history-body { flex: 1; min-height: 0; overflow-y: auto; }
    .history-pane { padding: 16px 20px 48px; }
    .history-note-title { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
    .history-diff ins { text-decoration: none; background: color-mix(in srgb, #3fb950 30%, transparent); border-radius: 3px; }
    .history-diff del { text-decoration: line-through; background: color-mix(in srgb, #f85149 30%, transparent); border-radius: 3px; }
    .history-diff input { pointer-events: none; }
    /*__CONTENT_CSS__*/
  </style>
</head>
<body>
  <div id="wordcount"></div>
  <div id="chips"></div>
  <textarea id="title" class="note-title" rows="1" placeholder="Untitled" spellcheck="false" disabled></textarea>
  <div id="editor"></div>
  <script>/*__BUNDLE__*/</script>
</body>
</html>
